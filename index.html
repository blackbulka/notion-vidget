<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --page: transparent;
  --card:#2f2629;
  --text:#f5efe5;
  --fill:#d8c4a2;
  --empty:#4a413b;
  --outline:#d8c4a2;
}

*{box-sizing:border-box}

html, body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  overflow:hidden;
  background:var(--page);
  font-family:Inter,Arial,sans-serif;
  color:var(--text);
}

body{
  display:flex;
}

.widget{
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  display:grid;
  grid-template-rows:repeat(4,minmax(0,1fr));
  gap:8px;
  padding:0;
  margin:0;
  background:transparent;
  border:0;
}

.item{
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:stretch;
  background:var(--card);
  border:0;
  border-radius:10px;
  padding:12px 13px;
  margin:0;
  overflow:hidden;
}

.top{
  flex:0 0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:8px;
  font-size:clamp(14px,1.2vw,18px);
  font-weight:400;
  line-height:1;
}

.val{
  color:var(--text);
  font-weight:400;
  white-space:nowrap;
}

.bar{
  flex:1 1 auto;
  min-height:0;
  width:100%;
  display:grid;
  grid-template-columns:repeat(100,minmax(0,1fr));
  gap:clamp(1px,.22vw,4px);
  align-items:stretch;
  overflow:hidden;
}

.seg{
  width:100%;
  min-width:0;
  height:100%;
  min-height:12px;
  background:transparent;
  border:1px solid var(--outline);
  border-radius:999px;
}

.seg.f{
  background:var(--fill);
  border-color:var(--fill);
}

@media (max-width:700px){
  .widget{gap:6px}
  .item{padding:9px 10px;border-radius:8px}
  .top{margin-bottom:6px}
}

@media (max-height:420px){
  .widget{gap:4px}
  .item{padding:6px 8px;border-radius:6px}
  .top{font-size:12px;margin-bottom:4px}
  .seg{min-height:6px}
}
</style></head><body>

<script>
function pct(a,b,c){return Math.max(0,Math.min(100,(a-b)/(c-b)*100))}
function upd(){
let n=new Date();
let ds=new Date(n);ds.setHours(0,0,0,0);let de=new Date(ds);de.setDate(de.getDate()+1);
let d=n.getDay();let off=d===0?6:d-1;let ws=new Date(ds);ws.setDate(ws.getDate()-off);let we=new Date(ws);we.setDate(we.getDate()+7);
let ms=new Date(n.getFullYear(),n.getMonth(),1),me=new Date(n.getFullYear(),n.getMonth()+1,1);
let ys=new Date(n.getFullYear(),0,1),ye=new Date(n.getFullYear()+1,0,1);
let vals={day:pct(n,ds,de),week:pct(n,ws,we),month:pct(n,ms,me),year:pct(n,ys,ye)};
Object.entries(vals).forEach(([k,v])=>{
let e=document.querySelector('[data-t="'+k+'"]');
e.querySelector('.val').textContent=Math.floor(v)+'%';
let fill=Math.round(v);
e.querySelectorAll('.seg').forEach((s,i)=>s.classList.toggle('f',i<fill));
});
}
upd();setInterval(upd,30000);
</script></body></html>
